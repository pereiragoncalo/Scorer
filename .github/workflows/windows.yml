name: Windows Scorer beta executables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [free, world]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-windows.txt
      - name: Check source syntax
        run: |
          python -m compileall -q main.py career.py menu_ui.py tools/build_windows.py desktop
      - name: Verify mandatory update policy
        run: python -m unittest discover -s tests -p test_windows_updates.py -v
      - name: Stage and compile Windows EXE
        shell: pwsh
        run: |
          python tools/build_windows.py --edition ${{ matrix.edition }} --output "${{ runner.temp }}\scorer-${{ matrix.edition }}" --dist "dist\windows"
      - name: Verify executable file
        shell: pwsh
        run: |
          $name = if ("${{ matrix.edition }}" -eq "free") { "ScorerFree.exe" } else { "ScorerWorld.exe" }
          $path = "dist\windows\$name"
          if (!(Test-Path $path)) { throw "Missing $path" }
          $item = Get-Item $path
          if ($item.Length -lt 500000) { throw "Unexpectedly small EXE" }
          Get-FileHash $path -Algorithm SHA256
      - name: Upload beta executable
        uses: actions/upload-artifact@v4
        with:
          name: scorer-windows-${{ matrix.edition }}-beta
          path: dist/windows/*.exe
          if-no-files-found: error
          retention-days: 14
