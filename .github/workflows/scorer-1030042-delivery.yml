name: Resume delivery of audited World 1030042
on:
  push:
    branches: [codex/world-1030042-delivery]
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    name: Deliver audited AAB and owner-side scripts to GitHub
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: scorer-world-1.0-1030042-unsigned
          run-id: 45648224609
          github-token: ${{ github.token }}
          path: /tmp/scorer-delivery
      - name: Transfer the audited bundle via Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aab=/tmp/scorer-delivery/bin/Scorer-World-1.0-1030042-unsigned.aab
          printf '%s  %s\n' c834291b379a8159fd46ec15bbcd44253e58f007baa9cafdd8b7cd9b5d9ad2da "$aab" | sha256sum -c -
          test "$(stat -c %s "$aab")" = 123969780
          transfer=$(mktemp -d)
          split -b 8M -d -a 2 "$aab" "$transfer/aab.part."
          test "$(find "$transfer" -name 'aab.part.*' | wc -l)" = 15
          cp /tmp/scorer-delivery/{qa-aab-report.json,bundle-manifest.xml} "$transfer/"
          cp tools/play/{bastion_publish_1030042.py,promote_alpha_1030042.py} "$transfer/"
          cd "$transfer"
          sha256sum aab.part.* *.py qa-aab-report.json bundle-manifest.xml > SHA256SUMS
          sha256sum -c SHA256SUMS
          git init -b transfer-world-1030042
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          gh auth setup-git
          git add .
          git commit -m 'Transfer verified unsigned Scorer World 1030042'
          git push origin HEAD:refs/heads/transfer-world-1030042
