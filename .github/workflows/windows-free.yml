name: Scorer Free Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-free.yml'
      - 'tools/windows/**'
      - 'desktop_launcher.py'
      - 'desktop_dashboard.py'
      - 'dashboard_data.py'
      - 'ui_tests/test_windows_dashboard.py'
      - 'tests/test_windows.py'
env:
  PYTHONUTF8: '1'
  KIVY_GL_BACKEND: angle_sdl2
  KIVY_AUDIO: sdl2
  KIVY_NO_ARGS: '1'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: tools/windows/requirements.txt
      - name: Install Windows build dependencies
        run: python -m pip install -r tools/windows/requirements.txt
      - name: Verify staging and persistent-save rules
        run: python -m unittest discover -s tests -p test_windows.py -v
      - name: Build single executable
        run: python tools/windows/build.py --output dist/windows
      - name: Test the frozen executable outside its installation directory
        shell: pwsh
        env:
          KIVY_GL_BACKEND: angle_sdl2
          KIVY_AUDIO: sdl2
          KIVY_NO_ARGS: '1'
        run: |
          $env:STRIKER_SAVE_DIR = Join-Path $env:RUNNER_TEMP 'scorer-smoke-saves'
          $report = Join-Path $env:GITHUB_WORKSPACE 'dist/windows/smoke.json'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/windows/Scorer-Free.exe'
          $process = Start-Process -FilePath $exe -ArgumentList @('--smoke-test', $report) -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Windows smoke timed out' }
          if ($process.ExitCode -ne 0) { throw "Scorer smoke exit code $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw 'No frozen smoke report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or $result.platform -ne 'win32') { throw 'Frozen Windows checks failed' }
          Get-Content $report
          python tools/windows/verify_smoke.py dist/windows
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Scorer-Free-Windows-QA
          path: dist/windows/
          retention-days: 14
