name: Deliver verified Scorer artifacts
on:
  workflow_dispatch:
    inputs:
      transfer_commit:
        description: Immutable commit containing the verified transfer parts (bundle delivery only)
        required: false
        type: string
      deliver_names:
        description: Deliver the checked editor JSON files instead of an APK
        required: false
        default: false
        type: boolean
      deliver_automation:
        description: Deliver owner-side internal Play uploader only (no Google secrets)
        required: false
        default: false
        type: boolean
      deliver_statistics_repair:
        description: Deliver only the tested statistics backend repair
        required: false
        default: false
        type: boolean
      deliver_activity_dashboard:
        description: Deliver the dashboard-only openings and closes patch
        required: false
        default: false
        type: boolean
      deliver_season_board_repair:
        description: Deliver the pinned legacy-maintenance compatibility fix only
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  deliver:
    if: ${{ !inputs.deliver_names && !inputs.deliver_automation && !inputs.deliver_statistics_repair && !inputs.deliver_activity_dashboard && !inputs.deliver_season_board_repair }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify the already verified unsigned AAB
        id: download
        env:
          TRANSFER_COMMIT: ${{ inputs.transfer_commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, urllib.request
          commit = os.environ['TRANSFER_COMMIT']
          assert re.fullmatch('[0-9a-f]{40}', commit)
          base = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + commit + '/'
          def read(name):
              with urllib.request.urlopen(base + name, timeout=60) as response:
                  return response.read()
          def read_part(part):
              # Large raw downloads can stall. Fetch the same immutable blob
              # through GitHub's authenticated API, keeping all digest checks.
              assert re.fullmatch('[0-9a-f]{40}', part['blob'])
              endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + part['blob']
              for attempt in range(3):
                  try:
                      payload = subprocess.check_output(['gh', 'api', '--method', 'GET', endpoint], timeout=60)
                      blob = json.loads(payload)
                      assert blob['encoding'] == 'base64' and blob['size'] == part['bytes']
                      return base64.b64decode(blob['content'])
                  except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                      if attempt == 2:
                          raise
                      print('Retrying verified transfer part:', part['name'], flush=True)
          manifest = json.loads(read('manifest.json'))
          expected = 'd42b8a731bceac2624819feba99bf393cc5c6babad21d7efe06a7e2bcdc7e98d'
          assert manifest['version'] == '1.0-1030026-unsigned'
          assert manifest['filename'] == 'Scorer-World-1.0-1030026-unsigned.aab'
          assert manifest['sha256'] == expected and manifest['bytes'] == 118286759
          assert 1 <= len(manifest['parts']) <= 16
          digest = hashlib.sha256()
          total = 0
          with open('Scorer-World-1.0-1030026-unsigned.aab', 'wb') as output:
              for index, part in enumerate(manifest['parts']):
                  assert part['name'] == f'apk.part.{index:02d}'
                  content = read_part(part)
                  assert len(content) == part['bytes'] <= 8 * 1024 * 1024
                  assert hashlib.sha256(content).hexdigest() == part['sha256']
                  output.write(content)
                  digest.update(content)
                  total += len(content)
          assert total == 118286759 and digest.hexdigest() == expected
          metadata = json.loads(pathlib.Path('docs/RELEASE_1.0_1030026_artifacts.json').read_text())
          assert metadata['sha256'] == expected and metadata['bytes'] == total
          source = metadata['source_commit']
          assert re.fullmatch('[0-9a-f]{40}', source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_commit=' + source + '\n')
          print('Verified exact tested APK:', total, 'bytes;', expected)
          PY
      - name: Publish the QA download attachment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.download.outputs.source_commit }}
        run: |
          if ! gh release view world-1.0-1030026 >/dev/null 2>&1; then
            gh release create world-1.0-1030026 --target "$GITHUB_SHA" --prerelease --title "Scorer World 1.0 (1030026) - rounded hex nets and faster play" --notes-file docs/RELEASE_1.0_1030026.md
          fi
          gh release upload world-1.0-1030026 Scorer-World-1.0-1030026-unsigned.aab docs/RELEASE_1.0_1030026_artifacts.json tools/play/sign_local_bundle.py tools/play/bastion_bundle_1030026.py tools/play/bastion_play_internal.py docs/data/server/Scorer-Immediate-Leaderboard-Backend.py docs/play/FIXES_1030026.md docs/media/Scorer-Rounded-Hex-Net-1030026.png docs/media/Scorer-Rounded-Hex-Net-Impact-1030026.png --clobber

  names:
    if: ${{ inputs.deliver_names }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the importable JSON files
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import hashlib,json
          root=Path('docs/data/name-packs')
          expected={
            'Scorer-World-Real-Names-0.9.10.json':(130196,'05d7d61ad2441cb01a6c4be1822de8940abf6bd6272d2160e339601731eeb0d9'),
            'Scorer-World-Real-Names-Compatible.json':(123595,'2423ed8cf2bd522bfb2877cdd4a006c478b46aa1824f61c285ec7f958594cef3'),
          }
          for filename,(size,digest) in expected.items():
              raw=(root/filename).read_bytes()
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==digest
              data=json.loads(raw)
              assert data['version']==1 and set(data)=={'version','clubs','leagues','players'}
              assert len(raw)<=262144 and sum(len(data[k]) for k in ('clubs','leagues','players'))<=4096
          PYCODE
          python3 -m unittest discover -s tests -p test_current_name_pack.py
      - name: Publish uncompressed editor JSON attachments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload real-names-0.9.10 docs/data/name-packs/Scorer-World-Real-Names-0.9.10.json docs/data/name-packs/Scorer-World-Real-Names-Compatible.json --clobber

  automation:
    if: ${{ inputs.deliver_automation && !inputs.deliver_names }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test owner-side uploader with disposable fixtures only
        run: python3 -m unittest tests.test_play_automation -q
      - name: Verify public uploader checksum
        run: |
          cd tools/play
          sha256sum -c ../../docs/play/BASTION_PLAY_AUTOMATION.sha256
      - name: Attach public uploader (no service-account keys or Play API invocation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view play-automation-v1.25 >/dev/null 2>&1; then
            gh release create play-automation-v1.25 --target "$GITHUB_SHA" --prerelease --title "Scorer - Play internal uploader for 1030026" --notes-file docs/RELEASE_PLAY_AUTOMATION_V1_25.md
          fi
          gh release upload play-automation-v1.25 tools/play/bastion_play_internal.py docs/play/BASTION_PLAY_AUTOMATION.md docs/play/BASTION_PLAY_AUTOMATION.sha256 --clobber
          if gh release view world-1.0-1030026 >/dev/null 2>&1; then
            gh release upload world-1.0-1030026 docs/play/FIXES_1030026.md --clobber
          fi

  statistics_repair:
    if: ${{ inputs.deliver_statistics_repair }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Rehearse source and shipped installer with real isolated HTTP
        run: |
          python3 -m unittest tests.test_stats_agreement_installer -q
          python3 docs/data/server/Scorer-Statistics-Agreement-Backend-Repair-1.py --check
          printf '%s  %s\n' 5c8d54c88e507490eb0cce421307449d44ed691f5ed97cf8a76ae6e0e0694f22 docs/data/server/Scorer-Statistics-Agreement-Backend-Repair-1.py | sha256sum -c -
      - name: Publish public repair only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload world-1.0-1030005 docs/data/server/Scorer-Statistics-Agreement-Backend-Repair-1.py docs/play/STATISTICS_1030005.md --clobber

  activity_dashboard:
    if: ${{ inputs.deliver_activity_dashboard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify activity report and transactional installer
        run: |
          python3 -m unittest tests.test_activity_stats tests.test_usage_collector tests.test_stats_agreement_installer tests.test_update_backend_installer -q
          python3 tools/build_activity_installer.py Scorer-Activity-Stats-Backend.py
          python3 Scorer-Activity-Stats-Backend.py --check
          echo '488094e698e1dc8e661838eb03c6bb993d9878f31dbe5f48d9c665f9083cddb7  Scorer-Activity-Stats-Backend.py' | sha256sum -c -
      - name: Publish dashboard-only patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload stats-dashboard-v1 Scorer-Activity-Stats-Backend.py docs/RELEASE_ACTIVITY_STATS_V1.md --clobber

  season_board_repair:
    if: ${{ inputs.deliver_season_board_repair }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify known legacy maintenance upgrade and rollback
        run: |
          python3 -m unittest tests.test_season_board_legacy tests.test_division_board -q
          python3 docs/data/server/Scorer-Season-Leaderboard-Backend-Repair-2.py --check
          echo 'befaa13310e4f7064219a68d7b93c3182e780dd62272e8755e6be0985531e48d  docs/data/server/Scorer-Season-Leaderboard-Backend-Repair-2.py' | sha256sum -c -
      - name: Publish backend-only compatibility repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload world-1.0-1030020 docs/data/server/Scorer-Season-Leaderboard-Backend-Repair-2.py docs/play/NET_VARIANTS_1030020.md docs/RELEASE_1.0_1030020_artifacts.json --clobber
