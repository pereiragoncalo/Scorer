name: Deliver verified World 0.9.10 APK
on:
  workflow_dispatch:
    inputs:
      transfer_commit:
        description: Immutable commit containing the verified transfer parts
        required: true
        type: string
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify the already tested APK
        id: download
        env:
          TRANSFER_COMMIT: ${{ inputs.transfer_commit }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request
          commit = os.environ['TRANSFER_COMMIT']
          assert re.fullmatch('[0-9a-f]{40}', commit)
          base = 'https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY'] + '/' + commit + '/'
          def read(name):
              with urllib.request.urlopen(base + name, timeout=60) as response:
                  return response.read()
          manifest = json.loads(read('manifest.json'))
          expected = 'f41ca3ce47bc21d6896168d2837bb087c306f4a0936a1960bb2318cc9ea54444'
          assert manifest['version'] == '0.9.10'
          assert manifest['filename'] == 'Scorer-World-0.9.10.apk'
          assert manifest['sha256'] == expected and manifest['bytes'] == 86066299
          assert 1 <= len(manifest['parts']) <= 16
          digest = hashlib.sha256()
          total = 0
          with open('Scorer-World-0.9.10.apk', 'wb') as output:
              for index, part in enumerate(manifest['parts']):
                  assert part['name'] == f'apk.part.{index:02d}'
                  content = read(part['name'])
                  assert len(content) == part['bytes'] <= 8 * 1024 * 1024
                  assert hashlib.sha256(content).hexdigest() == part['sha256']
                  output.write(content)
                  digest.update(content)
                  total += len(content)
          assert total == 86066299 and digest.hexdigest() == expected
          metadata = json.loads(pathlib.Path('docs/RELEASE_0.9.10_artifacts.json').read_text())
          assert metadata['sha256'] == expected and metadata['bytes'] == total
          source = metadata['source_commit']
          assert re.fullmatch('[0-9a-f]{40}', source)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_commit=' + source + '\n')
          print('Verified exact tested APK:', total, 'bytes;', expected)
          PY
      - name: Publish the QA download attachment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.download.outputs.source_commit }}
        run: |
          if ! gh release view qa-0.9.10 >/dev/null 2>&1; then
            gh release create qa-0.9.10 --target "$SOURCE_COMMIT" --prerelease --title "Scorer World 0.9.10 QA - conditional coach meetings and newspaper" --notes-file docs/RELEASE_0.9.10.md
          fi
          gh release upload qa-0.9.10 Scorer-World-0.9.10.apk docs/RELEASE_0.9.10_artifacts.json --clobber
