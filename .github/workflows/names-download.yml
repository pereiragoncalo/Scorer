name: Publish names JSON download
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach uncompressed editor JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload real-names-2026-07 docs/data/name-packs/Scorer-World-Real-Names-Europe-Brazil-Argentina-2026-07.json --clobber
