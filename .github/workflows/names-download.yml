name: Publish names JSON download
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach uncompressed editor JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view real-names-divisions-2026 >/dev/null 2>&1; then
            gh release create real-names-divisions-2026 --target "$GITHUB_SHA" --title 'Corrected real names by division — Europe 2026/27, Brazil and Argentina 2026' --notes 'Corrected division mapping for 494 unique real clubs. Europe 2026/27; Brazil and Argentina 2026. Existing game capacities apply; player source remains July 2026. Download the uncompressed JSON asset and reimport in Names Editor. Compatible with World 0.9.3; no new APK. This supersedes the older July names packs.'
          fi
          gh release upload real-names-divisions-2026 docs/data/name-packs/Scorer-World-Real-Names-Divisions-2026.json --clobber
