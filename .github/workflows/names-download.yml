name: Publish names JSON download
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach uncompressed editor JSON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view real-names-2026-07 >/dev/null 2>&1; then
            gh release create real-names-2026-07 --target "$GITHUB_SHA" --title 'Scorer World real names — Europe, Brazil and Argentina' --notes 'Uncompressed JSON names pack for the Scorer World editor. Dataset snapshot: July 2026. Download the JSON asset, then Names Editor → Import Names File.'
          fi
          gh release upload real-names-2026-07 docs/data/name-packs/Scorer-World-Real-Names-Europe-Brazil-Argentina-2026-07.json --clobber
