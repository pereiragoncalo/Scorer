name: PenaltyMind APK test build
on:
  push:
    branches:
      - experiments/penaltymind-godot-apk
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot 4.7.2 and Android export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Ensure Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK at: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No sdkmanager found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 3 -type d | head -50
            exit 1
          fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "ndk;28.1.13356709" "cmake;3.10.2.4988404"
      - name: Configure Godot Android SDK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path PenaltyMind_Godot --quit
          python3 - <<'PY'
          import os
          from pathlib import Path
          folder = Path.home() / ".config" / "godot"
          files = sorted(folder.glob("editor_settings-4*.tres"))
          if not files:
              raise RuntimeError("Godot editor settings not found")
          path = files[-1]
          txt = path.read_text()
          if "[resource]" not in txt:
              raise RuntimeError("Unexpected editor settings file")
          settings = ('export/android/android_sdk_path = "' + os.environ["ANDROID_HOME"] + '"\n' +
                      'export/android/java_sdk_path = "' + os.environ["JAVA_HOME"] + '"\n')
          txt = txt.replace("[resource]", "[resource]\n" + settings)
          path.write_text(txt)
          print("Configured:", path)
          PY
      - name: Generate temporary debug signature
        shell: bash
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/penaltymind-debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=PenaltyMind Test, O=CLEMiR, C=PT"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/penaltymind-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Export installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path PenaltyMind_Godot --export-debug Android PenaltyMind-debug.apk
          ls -lh PenaltyMind-debug.apk
          sha256sum PenaltyMind-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PenaltyMind-Android-APK
          path: PenaltyMind-debug.apk
          if-no-files-found: error
          retention-days: 30
