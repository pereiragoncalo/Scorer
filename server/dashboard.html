<!doctype html>
<html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Scorer — aberturas e fechos</title>
<style>
body{font:17px system-ui;max-width:760px;margin:32px auto;padding:16px;background:#071820;color:#eef}
h1{font-size:1.7rem}button,input{font:inherit;padding:12px;box-sizing:border-box}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:180px}button{cursor:pointer}
.cards{display:flex;gap:16px;flex-wrap:wrap}.card{flex:1;background:#173742;border-radius:12px;padding:20px;min-width:170px}.value{display:block;font-size:2.4rem;font-weight:700}
table{width:100%;border-collapse:collapse;margin-top:24px}td,th{padding:12px 8px;border-bottom:1px solid #34515a;text-align:right}td:first-child,th:first-child{text-align:left}small{color:#b9cbd0}a{color:#b9cbd0}
</style>
<h1>Aberturas e fechos do jogo</h1>
<p>Últimos 30 dias, incluindo hoje.</p>
<form id="form"><input id="token" type="password" autocomplete="off" placeholder="Token de administrador" aria-label="Token de administrador" required><button>Carregar</button></form>
<p id="status" role="status"></p>
<section id="stats" hidden>
<div class="cards"><div class="card">Aberturas <span class="value" id="opens"></span></div><div class="card">Fechos <span class="value" id="closes"></span></div></div>
<p id="period"></p>
<table><thead><tr><th scope="col">Dia</th><th scope="col">Aberturas</th><th scope="col">Fechos</th></tr></thead><tbody id="rows"></tbody></table>
<p><small>Datas em UTC, pelo dia de receção. Fechos normais registados; encerramentos forçados pelo Android podem não ser contados.</small></p>
</section>
<p><small><a href="/admin/manage">Gestão</a></small></p>
<script>
const number=new Intl.NumberFormat('pt-PT');
const day=s=>{const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
document.getElementById('form').onsubmit=async e=>{
 e.preventDefault();const token=document.getElementById('token');const secret=token.value;token.value='';
 const status=document.getElementById('status');const stats=document.getElementById('stats');stats.hidden=true;status.textContent='A carregar…';
 try{
  const r=await fetch('/v1/activity',{headers:{Authorization:'Bearer '+secret},cache:'no-store'});
  if(!r.ok)throw Error();const data=await r.json();
  document.getElementById('opens').textContent=number.format(data.opens);
  document.getElementById('closes').textContent=number.format(data.closes);
  document.getElementById('period').textContent=day(data.start)+' a '+day(data.end)+' · UTC';
  const rows=document.getElementById('rows');rows.replaceChildren();
  for(const item of data.days){const tr=document.createElement('tr');for(const value of [day(item.day),number.format(item.opens),number.format(item.closes)]){const td=document.createElement('td');td.textContent=value;tr.append(td)}rows.append(tr)}
  stats.hidden=false;status.textContent='';
 }catch(_){status.textContent='Não foi possível carregar. Verifica o token e tenta novamente.'}
};
</script></html>
