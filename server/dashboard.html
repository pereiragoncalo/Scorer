<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Scorer usage</title>
<style>body{font:18px system-ui;max-width:850px;margin:40px auto;padding:16px;background:#071820;color:#eef}button,input{font:inherit;padding:12px}td,th{padding:8px;text-align:left}small{color:#abc}</style>
<h1>Scorer usage</h1><p>Private aggregate counters. These are events, not unique players.</p>
<form id="form"><input id="token" type="password" autocomplete="off" placeholder="Administrator token" required><button>Load totals</button></form>
<p id="status"></p><table><thead><tr><th>UTC day</th><th>Event</th><th>Count</th></tr></thead><tbody id="rows"></tbody></table>
<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const t=document.getElementById('token');try{const r=await fetch('/v1/totals',{headers:{Authorization:'Bearer '+t.value},cache:'no-store'});t.value='';if(!r.ok)throw Error();const d=await r.json();const rows=document.getElementById('rows');rows.replaceChildren();for(const x of d.totals){const tr=document.createElement('tr');for(const v of [x.day,x.event,x.count]){const td=document.createElement('td');td.textContent=v;tr.append(td)}rows.append(tr)}document.getElementById('status').textContent='Loaded'}catch(_){document.getElementById('status').textContent='Unavailable or incorrect token'}}</script></html>
