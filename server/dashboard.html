<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Scorer usage</title>
<style>body{font:18px system-ui;max-width:850px;margin:40px auto;padding:16px;background:#071820;color:#eef}button,input{font:inherit;padding:12px}td,th{padding:8px;text-align:left}small{color:#abc}</style>
<h1>Scorer usage</h1><p>Private aggregate counters. These are events, not unique players.</p>
<form id="form"><input id="token" type="password" autocomplete="off" placeholder="Administrator token" required><button>Load totals</button></form>
<p id="status"></p><table><thead><tr><th>UTC day</th><th>Event</th><th>Count</th></tr></thead><tbody id="rows"></tbody></table>
<script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const t=document.getElementById('token');try{const r=await fetch('/v1/totals',{headers:{Authorization:'Bearer '+t.value},cache:'no-store'});t.value='';if(!r.ok)throw Error();const d=await r.json();const rows=document.getElementById('rows');rows.replaceChildren();for(const x of d.totals){const tr=document.createElement('tr');for(const v of [x.day,x.event,x.count]){const td=document.createElement('td');td.textContent=v;tr.append(td)}rows.append(tr)}document.getElementById('status').textContent='Loaded'}catch(_){document.getElementById('status').textContent='Unavailable or incorrect token'}}</script>
<h2>Public records and reports</h2><p>New names stay private until approved. Review reports, reject unsafe names or suspend a publisher. Never request an ownership token.</p>
<form id="moderation-form"><input id="moderation-token" type="password" autocomplete="off" placeholder="Administrator token" required><button>Load moderation</button></form>
<p id="moderation-status"></p><div id="moderation"></div>
<script>
const mt=document.getElementById('moderation-token');let admin='';
const api=async(path,data)=>{const r=await fetch(path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+admin,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined,cache:'no-store'});if(!r.ok)throw Error('Unavailable');return r.status===204?{}:r.json()};
const loadModeration=async()=>{const d=await api('/v1/moderation');const box=document.getElementById('moderation');box.replaceChildren();const count=document.createElement('p');count.textContent=d.reports.length+' report groups; '+d.banned.length+' suspended publishers';box.append(count);
for(const x of d.entries){const card=document.createElement('section');const text=document.createElement('p');text.textContent=[x.player,x.team,x.country,x.division,x.goals,x.state,'terms '+x.terms,x.publisher].join(' · ');card.append(text);const reports=d.reports.filter(y=>y.publisher===x.publisher);for(const y of reports){const p=document.createElement('p');p.textContent='Report: '+y.reason+' ('+y.count+')';card.append(p)}
for(const action of ['approve','reject','ban','unban','erase']){const b=document.createElement('button');b.textContent=action;b.type='button';b.disabled=action==='approve'&&x.terms!==1;b.onclick=async()=>{if(!confirm(action+' this publisher?'))return;try{await api('/v1/moderation',{publisher:x.publisher,action});await loadModeration()}catch(_){document.getElementById('moderation-status').textContent='Action failed'}};card.append(b)}box.append(card)}
for(const publisher of d.banned){if(d.entries.some(x=>x.publisher===publisher))continue;const b=document.createElement('button');b.textContent='Lift suspension '+publisher;b.onclick=async()=>{try{await api('/v1/moderation',{publisher,action:'unban'});await loadModeration()}catch(_){document.getElementById('moderation-status').textContent='Action failed'}};box.append(b)}document.getElementById('moderation-status').textContent='Loaded';};
document.getElementById('moderation-form').onsubmit=async e=>{e.preventDefault();admin=mt.value;mt.value='';try{await loadModeration()}catch(_){admin='';document.getElementById('moderation-status').textContent='Unavailable or incorrect token'}};
window.addEventListener('pagehide',()=>{admin=''});setInterval(()=>{admin='';document.getElementById('moderation-status').textContent='For security, enter the token again before the next action'},10*60*1000);
</script>

</html>
