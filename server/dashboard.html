<!doctype html>
<html lang="pt"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Scorer — sessões</title>
<style>
body{font:17px system-ui;max-width:760px;margin:32px auto;padding:16px;background:#071820;color:#eef}
h1{font-size:1.7rem}button,input{font:inherit;padding:12px;box-sizing:border-box}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:180px}button{cursor:pointer}
.cards{display:flex;gap:16px;flex-wrap:wrap}.card{flex:1;background:#173742;border-radius:12px;padding:20px;min-width:170px}.value{display:block;font-size:2.4rem;font-weight:700}
label{display:flex;align-items:center;gap:8px}input[type=date]{min-width:0}small{color:#b9cbd0}a{color:#b9cbd0}
</style>
<h1>Sessões do jogo</h1>
<form id="form"><label>Dia (UTC) <input id="day" type="date" required></label><input id="token" type="password" autocomplete="off" placeholder="Token de administrador" aria-label="Token de administrador" required><button>Carregar</button></form>
<p id="status" role="status"></p>
<section id="stats" hidden>
<div class="cards"><div class="card">Sessões abertas <span class="value" id="opens"></span></div><div class="card">Tempo médio <span class="value" id="average"></span></div></div>
<p><small>Dia de receção em UTC. A média inclui sessões com duração medida em primeiro plano. — indica que ainda não há medições.</small></p>
</section>
<p><small><a href="/admin/manage">Gestão</a></small></p>
<script>
const number=new Intl.NumberFormat('pt-PT');
const duration=seconds=>{
 if(seconds==null)return '—';
 const rounded=Math.round(seconds), hours=Math.floor(rounded/3600), minutes=Math.floor(rounded/60)%60, rest=rounded%60;
 return (hours ? hours+' h ' : '')+(hours||minutes ? minutes+' min ' : '')+rest+' s';
};
const form=document.getElementById('form');
const day=document.getElementById('day');
const token=document.getElementById('token');
const button=form.querySelector('button');
const status=document.getElementById('status');
const stats=document.getElementById('stats');
day.value=day.max=new Date().toISOString().slice(0,10);
let authorization='';
day.onchange=()=>{stats.hidden=true;status.textContent='';};
form.onsubmit=async event=>{
 event.preventDefault();
 if(button.disabled)return;
 const selected=day.value;
 const secret=token.value || authorization;
 token.value='';
 button.disabled=true;
 stats.hidden=true;
 status.textContent='A carregar…';
 try{
  const response=await fetch('/v1/activity?'+new URLSearchParams({day:selected}),{
   headers:{Authorization:'Bearer '+secret},cache:'no-store'
  });
  if(response.status===404){
   authorization='';
   token.required=true;
   status.textContent='Verifica o token de administrador.';
   return;
  }
  if(!response.ok)throw Error();
  const data=await response.json();
  authorization=secret;
  token.required=false;
  if(day.value!==selected)return;
  document.getElementById('opens').textContent=number.format(data.opens);
  document.getElementById('average').textContent=duration(data.average_seconds);
  stats.hidden=false;
  status.textContent='';
 }catch(_){
  status.textContent='Não foi possível carregar os dados deste dia.';
 }finally{
  button.disabled=false;
 }
};
</script></html>
